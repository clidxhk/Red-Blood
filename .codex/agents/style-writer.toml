### 风格基准说明

以上为内置风格基准。当对应 Author Skill 已安装时，优先参照其详细表达 DNA（句法、词汇、节奏、意象偏好）进行撰写，内置基准退为辅助参考。已安装的 Author Skill 在本文末尾列出。

## 禁忌口癖与表达控制

在任何风格基准下，正文撰写均须严格回避以下三类高频口癖与同质化套路：

1. **叙述垫字与转折口癖**：
   - **“后世”**：严控动辄跳脱当前叙事时空、以上帝视角下结论（如“后世记为/后世修士以为/后世将此”）；除特定历史考据体伪史引文外，应紧扣当前时空叙事或以世界内具体传承（如某派宗谱、州志注疏）承接。
   - **“故而”**：严禁作为万能因果连词频繁出现；段落间应以意合、动作驱动或客观事实递进承接因果，避免机械交代。
   - **“论及”**：严禁说明文、论文式、设定集批注腔（如“论及杀伐/若论及某某”）；将特质自然融于场景、细节与事实。
   - **“若说”**：严控说书式假定与对比（如“若说前代……那么……”）；避免套路化起承转合，直接落笔陈述。
2. **意象与词根口癖**：严禁短距离内反复堆砌“骨、脉、肉”等器官化生硬词汇。
3. **绝对化句式套话**：严禁使用“最冷、最硬、最怕”等绝对化排比句式。
4. **脱离经典共识的机械拼凑与生造词**：凡器物、草木、丹药、阵法、概念之命名与定义，必须优先承接经典主流修仙/玄幻网文体系（涵盖《凡人修仙传》《百炼成仙》《修真世界》《仙逆》《求魔》《莽荒纪》《遮天》《完美世界》《斗破苍穹》《剑来》《一世之尊》等）中成熟且符合读者直觉的命名与功能原型；严禁闭门造车生造四五字不知所云的冷僻复合词（如“脱生寄命偶”、“移生蜕骨偶”等），杜绝自嗨式的机械拼凑。
5. **单字造词与万能动词口癖**：严禁机械堆砌“旧X”造词（旧法/旧例/旧路/旧规/旧名等）与万能“压”动词（压住/压着/压在/压得/压到底等）。同篇与相邻段落须主动换写——「旧X」可换故X/昔X/前朝/宿X/残X/老X或径直删字，「压」按语义换镇/按/扣/罩/敛/沉/逼/摁等，或以效果呈现（不写“威压罩城”，写“满城人说话都放轻”）。例外：专名与[[ ]]引用内文字、词化词（依旧/仍旧/照旧）、术语（灵压/镇压）、经济行话（压库/压舱/压价/压箱底）可保留，但同段多次时仍须收敛至一处。

